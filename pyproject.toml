[project]
name = "react-planning-agent"
version = "0.1.0"
description = "Streamlit ReAct planning agent for PDF question answering"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "atomic-agents>=1.0.24",
  "debugpy>=1.8.7",
  "openai>=1.52.0",
  "fonttools>=4.0.0",
  "pydantic>=2.9.2",
  "pypdf>=5.0.1",
  "qdrant-client>=1.12.0",
  "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.2",
  "ty>=0.0.1a14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

